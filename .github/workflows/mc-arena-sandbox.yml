name: Build Minestom Arena sandbox

on:
  push:
    branches:
      - sandbox/mc-arena-build
    paths:
      - ".github/workflows/mc-arena-sandbox.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone Arena
        run: git clone --depth 1 https://github.com/Minestom/Arena.git arena

      - name: Build fat jar
        working-directory: arena
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
          ls -lh build/libs

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-arena-jar
          path: arena/build/libs/*all.jar
          if-no-files-found: error
          retention-days: 1
